[package]
name = "glance-deck-firmware"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"

[package.metadata.esp-idf-sys]
esp_idf_version = "v5.3.1"
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults"]

[[package.metadata.esp-idf-sys.extra_components]]
bindings_header = "components/rlcd/include/rlcd.h"
component_dirs = ["components/rlcd"]

[features]
default = []
esp = ["dep:anyhow", "dep:esp-idf-hal", "dep:esp-idf-svc", "dep:esp-idf-sys", "dep:log"]

[dependencies]
anyhow = { version = "1.0", optional = true }
embedded-svc = "0.28"
esp-idf-hal = { version = "0.45", optional = true }
esp-idf-svc = { version = "0.51", features = ["experimental"], optional = true }
esp-idf-sys = { version = "0.36", features = ["binstart"], optional = true }
log = { version = "0.4", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc"] }

[build-dependencies]
embuild = { version = "0.32", features = ["espidf"] }

[[bin]]
name = "glance-deck-firmware"
path = "src/main.rs"
required-features = ["esp"]

[[bin]]
name = "render-local-screens"
path = "src/bin/render-local-screens.rs"
