[package]
name = "glance-deck-firmware"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"

[package.metadata.esp-idf-sys]
esp_idf_version = "v5.3.1"
sdkconfig_defaults = ["sdkconfig.defaults"]

[dependencies]
anyhow = "1.0"
embedded-svc = "0.28"
esp-idf-hal = "0.45"
esp-idf-svc = "0.51"
esp-idf-sys = { version = "0.36", features = ["binstart"] }
log = "0.4"

[build-dependencies]
embuild = "0.32"
