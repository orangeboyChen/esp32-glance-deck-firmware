name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust firmware checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: x86_64-unknown-linux-gnu
      - run: cargo fmt --check
      - run: cargo metadata --no-deps --format-version 1
      - run: cargo test --lib --no-default-features --target x86_64-unknown-linux-gnu

  # Builds the actual device image. Without this job nothing compiles `src/main.rs` or any of the
  # `esp` feature code, so a device-only regression (or a missing OTA signing key) passes CI and
  # only shows up on hardware.
  firmware:
    name: Build device image
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3.1
    env:
      # Same toolchain build as .devcontainer/Dockerfile, which pins the version espup installs.
      ESPUP_TOOLCHAIN_VERSION: 1.85.0.0
      # GitHub's container runs as root while $HOME points at /github/home. rustup-init refuses to
      # run when $HOME disagrees with the euid home directory, so override it for the whole job and
      # pin cargo/rustup under the same root.
      HOME: /root
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
      PATH: /root/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # A throwaway key generated for CI. It only proves the OTA verification path compiles and is
      # wired to a well-formed key; production images must supply the real public key.
      FIRMWARE_MANIFEST_PUBLIC_KEY_HEX: 3b6a27bcceb6a42d62a3a8d02a6f0d73653215771de243a63ac048a18b59da29
    steps:
      - name: Install build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git pkg-config libudev-dev

      - uses: actions/checkout@v4

      # The Xtensa target is not part of upstream stable Rust, so it comes from espup rather than
      # rustup. ldproxy is the linker declared in .cargo/config.toml.
      # GitHub's container runs as root while $HOME points at /github/home, and rustup-init refuses
      # to run when $HOME disagrees with the euid home directory. rustup reads $HOME directly, so
      # setting only CARGO_HOME/RUSTUP_HOME is not enough — HOME has to be overridden in the step.
      - name: Install the Xtensa toolchain
        env:
          HOME: /root
        run: |
          echo "${CARGO_HOME}/bin" >> "${GITHUB_PATH}"
          export PATH="${CARGO_HOME}/bin:${PATH}"
          case "$(uname -m)" in
            x86_64) host=x86_64-unknown-linux-gnu ;;
            aarch64) host=aarch64-unknown-linux-gnu ;;
            *) echo "unsupported architecture $(uname -m)" >&2; exit 1 ;;
          esac
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors -fsSL \
            "https://static.rust-lang.org/rustup/dist/${host}/rustup-init" -o /tmp/rustup-init
          chmod +x /tmp/rustup-init
          # espup detects "Rust is installed" by asking rustup for a toolchain, so bootstrap with a
          # concrete stable toolchain rather than `--default-toolchain none`.
          /tmp/rustup-init -y --profile minimal --default-toolchain stable --no-modify-path
          . "${CARGO_HOME}/env"
          rustc --version
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors -fsSL \
            "https://github.com/esp-rs/espup/releases/latest/download/espup-${host}" -o /usr/local/bin/espup
          chmod +x /usr/local/bin/espup
          espup install --targets esp32s3 --toolchain-version "${ESPUP_TOOLCHAIN_VERSION}"
          cargo install ldproxy --locked

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            /root/.cargo/registry
            /root/.cargo/git
            target
          key: firmware-${{ runner.os }}-${{ env.ESPUP_TOOLCHAIN_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: firmware-${{ runner.os }}-${{ env.ESPUP_TOOLCHAIN_VERSION }}-

      # `esp-idf-sys` needs the ESP-IDF environment exported by the container's entrypoint script.
      # RUSTUP_TOOLCHAIN selects the `esp` toolchain espup installed above.
      - name: Build the ESP32-S3 image
        env:
          RUSTUP_TOOLCHAIN: esp
        run: |
          . ${IDF_PATH}/export.sh
          cargo build --release --features esp

      - name: Report image size
        env:
          RUSTUP_TOOLCHAIN: esp
        run: |
          . ${IDF_PATH}/export.sh
          cargo build --release --features esp --message-format=json \
            | python3 -c "
          import json, sys
          for line in sys.stdin:
              try:
                  message = json.loads(line)
              except ValueError:
                  continue
              if message.get('reason') != 'compiler-artifact':
                  continue
              if 'glance-deck-firmware' not in message.get('target', {}).get('name', ''):
                  continue
              for filename in message.get('filenames', []):
                  if filename.endswith(('.bin', '.elf')):
                      print(filename)
          "

      # Proves build.rs rejects a malformed key instead of silently disabling OTA verification.
      - name: Reject a malformed OTA public key
        env:
          RUSTUP_TOOLCHAIN: esp
        run: |
          . ${IDF_PATH}/export.sh
          if FIRMWARE_MANIFEST_PUBLIC_KEY_HEX=not-a-key \
             cargo build --release --features esp 2>/dev/null; then
            echo "::error::build succeeded with a malformed OTA public key"
            exit 1
          fi
          echo "malformed key correctly rejected"
