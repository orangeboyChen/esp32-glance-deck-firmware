name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  console:
    name: Console build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
        working-directory: console
      - run: bun run test:coverage
        working-directory: console
      - run: bun run build
        working-directory: console

  firmware:
    name: Rust firmware checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,llvm-tools-preview
          targets: x86_64-unknown-linux-gnu
      - run: cargo fmt --check
        working-directory: firmware
      - run: cargo metadata --no-deps --format-version 1
        working-directory: firmware
      - name: Install Rust coverage tool
        run: cargo install cargo-llvm-cov --locked
      - name: Check firmware unit coverage
        run: cargo llvm-cov --lib --no-default-features --target x86_64-unknown-linux-gnu --fail-under-lines 90
        working-directory: firmware
      - name: Build firmware in Dev Container
        uses: devcontainers/ci@v0.3
        with:
          subFolder: .
          runCmd: . /home/esp/export-esp.sh && cd firmware && rustup run esp cargo build --features esp

  home-assistant:
    name: Home Assistant integration checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
        working-directory: home-assistant
      - run: uv run pytest
        working-directory: home-assistant
      - run: uv run python -m compileall -q custom_components
        working-directory: home-assistant
      - run: uv run python -m json.tool custom_components/glance_deck/manifest.json > /dev/null
        working-directory: home-assistant
      - run: uv run python -m json.tool custom_components/glance_deck/strings.json > /dev/null
        working-directory: home-assistant
      - run: uv run python -m json.tool custom_components/glance_deck/translations/en.json > /dev/null
        working-directory: home-assistant

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
